<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Pacientes | Sistema GM4</title>

    <link rel="stylesheet" href="cadastro-paciente.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <!-- <div class="container"> -->
    <div class="container container-fluid">

        <!-- ===================================
             CABEÇALHO
        ==================================== -->
        <header>

            <h1>
                <i class="fas fa-hospital-user"></i>
                Cadastro de Pacientes
            </h1>

            <div class="toolbar">

                <button type="button" id="btnNovo" class="btn btn-primary">
                    <i class="fas fa-plus"></i>
                    Novo
                </button>

                <button type="button" id="btnSalvar" class="btn btn-success" disabled>
                    <i class="fas fa-save"></i>
                    Gravar
                </button>

                <button type="button" id="btnEditar" class="btn btn-warning" disabled>
                    <i class="fas fa-edit"></i>
                    Editar
                </button>

                <button type="button" id="btnExcluir" class="btn btn-danger" disabled>
                    <i class="fas fa-trash"></i>
                    Excluir
                </button>

                <button type="button" id="btnSair" class="btn btn-dark">
                    <i class="fas fa-sign-out-alt"></i>
                    Sair
                </button>

            </div>

        </header>

        <!-- ===================================
             CONTEÚDO PRINCIPAL
        ==================================== -->
        <main>

            <!-- ===================================
                 FORMULÁRIO
            ==================================== -->
            <section class="form-area">

                <nav class="tabs-nav">

                    <button class="tab-link active" onclick="openTab(event,'aba1')">
                        1. Dados Pessoais
                    </button>

                    <button class="tab-link" onclick="openTab(event,'aba2')">
                        2. Contato
                    </button>

                    <button class="tab-link" onclick="openTab(event,'aba3')">
                        3. Endereço
                    </button>

                </nav>

                <div class="form-content">

                    <form id="pacienteForm">

                        <!-- ===================================
                             ABA 1
                        ==================================== -->
                        <div id="aba1" class="tab-content active">

                            <div class="form-grid">

                                <div class="form-group col-2">
                                    <label for="codigo">Código</label>
                                    <input type="text" id="codigo" readonly>
                                </div>

                                <div class="form-group col-10">
                                    <label for="nome">Nome Completo</label>
                                    <input type="text" id="nome" class="uppercase" disabled>
                                </div>

                                <div class="form-group col-3">
                                    <label for="dataNascimento">
                                        Data de Nascimento
                                    </label>
                                    <input type="date" id="dataNascimento" disabled onchange="calcularIdade()">
                                </div>

                                <div class="form-group col-3">
                                    <label for="idade">Idade</label>
                                    <input type="text" id="idade" readonly>
                                </div>

                                <div class="form-group col-3">
                                    <label for="cpf">CPF</label>
                                    <input type="text" id="cpf" maxlength="14" placeholder="000.000.000-00" disabled>
                                </div>

                                <div class="form-group col-3">
                                    <label for="tel1">Telefone</label>
                                    <input type="text" id="tel1" maxlength="15" placeholder="(00) 00000-0000" disabled>
                                </div>

                            </div>

                        </div>

                        <!-- ===================================
                             ABA 2
                        ==================================== -->
                        <div id="aba2" class="tab-content">

                            <div class="form-grid">

                                <div class="form-group col-12">
                                    <label for="email">E-mail</label>
                                    <input type="email" id="email" placeholder="email@dominio.com" disabled>
                                </div>

                            </div>

                        </div>

                        <!-- ===================================
                             ABA 3
                        ==================================== -->
                        <div id="aba3" class="tab-content">

                            <div class="form-grid">

                                <div class="form-group col-3">
                                    <label for="cep">CEP</label>
                                    <input type="text" id="cep" maxlength="9" placeholder="00000-000" disabled
                                        onblur="buscaCEP()">
                                </div>

                                <div class="form-group col-9">
                                    <label for="endereco">
                                        Endereço
                                    </label>
                                    <input type="text" id="endereco" disabled>
                                </div>

                            </div>

                        </div>

                    </form>

                </div>

            </section>

            <!-- ===================================
                 GRADE DE PACIENTES
            ==================================== -->
            <section class="grid-area">

                <div class="grid-header">
                    <i class="fas fa-list"></i>
                    Pacientes Cadastrados
                </div>

                <div class="table-wrapper">

                    <table id="tabelaPacientes">

                        <thead>
                            <tr>
                                <th style="width: 100px;">ID</th>
                                <th>Nome</th>
                                <th style="width: 180px;">CPF</th>
                                <th style="width: 180px;">Telefone</th>
                            </tr>
                        </thead>

                        <tbody id="corpoTabelaPacientes">
                            <!-- preenchido via JavaScript -->
                        </tbody>

                    </table>

                </div>

            </section>

        </main>

    </div>

    <!-- ===================================
         JAVASCRIPT
    ==================================== -->
    <script src="cadastro-paciente.js"></script>

</body>

</html>
