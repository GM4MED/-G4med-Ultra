<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Agenda médica do sistema G4med">

    <title>G4med - Agenda Médica</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8'
                        }
                    },
                    boxShadow: {
                        soft: '0 8px 24px rgba(15, 23, 42, 0.08)'
                    }
                }
            }
        };
    </script>

    <!-- CSS complementar dos elementos renderizados pelo JavaScript -->
    <style>
        [hidden] {
            display: none !important;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        body.modal-open {
            overflow: hidden;
        }

        .modal.is-open {
            display: flex;
        }

        .agenda__calendar {
            --quantidade-medicos: 3;
        }

        .agenda__calendar-header,
        .agenda__calendar-row {
            display: grid;
            grid-template-columns:
                84px repeat(var(--quantidade-medicos, 3),
                    minmax(220px, 1fr));
            min-width: 760px;
        }

        .agenda__calendar-header {
            position: sticky;
            top: 0;
            z-index: 20;
        }

        .agenda__calendar-row {
            min-height: 64px;
        }

        .agenda__appointment {
            position: relative;
            z-index: 2;
            display: flex;
            gap: 8px;
            min-height: 54px;
            height: var(--appointment-height, 100%);
            overflow: hidden;
            padding: 8px;
            border-left: 4px solid currentColor;
            border-radius: 8px;
            background: #ffffff;
            box-shadow: 0 2px 8px rgb(15 23 42 / 10%);
            cursor: pointer;
            transition:
                transform 160ms ease,
                box-shadow 160ms ease;
        }

        .agenda__appointment:hover,
        .agenda__appointment:focus-visible {
            z-index: 30;
            transform: translateY(-1px);
            box-shadow: 0 5px 14px rgb(15 23 42 / 18%);
            outline: 3px solid rgb(59 130 246 / 25%);
            outline-offset: 1px;
        }

        .agenda__appointment-time {
            flex: 0 0 auto;
            color: currentColor;
            font-size: 0.75rem;
            font-weight: 800;
        }

        .agenda__appointment-content {
            display: flex;
            min-width: 0;
            flex-direction: column;
            gap: 2px;
        }

        .agenda__appointment-content strong,
        .agenda__appointment-content span,
        .agenda__appointment-content small {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .agenda__appointment-content strong {
            color: #0f172a;
            font-size: 0.83rem;
        }

        .agenda__appointment-content span,
        .agenda__appointment-content small {
            color: #64748b;
            font-size: 0.73rem;
        }

        .agenda__appointment-icon {
            margin-left: auto;
            color: currentColor;
        }

        .agenda__appointment--agendado {
            color: #2563eb;
            background: #eff6ff;
        }

        .agenda__appointment--confirmado {
            color: #16a34a;
            background: #f0fdf4;
        }

        .agenda__appointment--espera {
            color: #d97706;
            background: #fffbeb;
        }

        .agenda__appointment--atendido {
            color: #0891b2;
            background: #ecfeff;
        }

        .agenda__appointment--cancelado {
            color: #dc2626;
            background: #fef2f2;
            opacity: 0.72;
        }

        .agenda__appointment--nao-compareceu {
            color: #7c3aed;
            background: #f5f3ff;
        }

        .agenda__empty {
            min-width: 760px;
            padding: 48px 20px;
            color: #64748b;
            text-align: center;
        }

        .toast {
            animation: toast-enter 180ms ease-out;
        }

        .toast.is-leaving {
            animation: toast-leave 250ms ease-in forwards;
        }

        @keyframes toast-enter {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes toast-leave {
            to {
                opacity: 0;
                transform: translateY(10px);
            }
        }
    </style>
</head>

<body class="min-h-screen bg-slate-100 text-slate-800">

                    <span>Novo Agendamento</span>

            </div>
        </div>

         LEGENDA
         ===================================================== -->

        <span class="inline-flex items-center gap-2 text-xs font-medium text-slate-600">

    <!-- =====================================================

         ===================================================== -->

    <main class="mx-auto max-w-[1800px] px-4 pb-8 sm:px-6 lg:px-8">

        <section class="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-soft"
            aria-label="Grade de agendamentos médicos">

            <div id="agenda-header" class="agenda__calendar-header border-b border-slate-200 bg-slate-50"
                aria-label="Profissionais da agenda">

                <div
                    class="flex min-h-[72px] items-center justify-center border-r border-slate-200 px-3 text-xs font-bold uppercase tracking-wide text-slate-500">

                    Horário

                <div class="flex min-h-[72px] flex-col justify-center gap-1 border-r border-slate-200 px-3"
                    data-medico="1">

                    <span class="text-sm font-bold text-slate-900">
                        Dr. Carlos Silva
                    </span>

                    <span class="text-xs text-slate-500">
                        Cardiologia
                    </span>
                </div>

                <div class="flex min-h-[72px] flex-col justify-center gap-1 border-r border-slate-200 px-3"
                    data-medico="2">

                    <span class="text-sm font-bold text-slate-900">
                        Dra. Ana Paula
                    </span>

                    <span class="text-xs text-slate-500">
                        Dermatologia

                        Ortopedia e Traumatologia

            </div>

            <div id="agenda-body" class="overflow-x-auto" aria-live="polite" aria-atomic="false">

                <div class="p-12 text-center text-sm text-slate-500">
                    Carregando agenda...
                </div>
            </div>
        </section>

    <!-- =====================================================
         MODAL: NOVO / EDITAR AGENDAMENTO
         ===================================================== -->

    <div id="modal-agendamento" class="modal fixed inset-0 z-50 hidden items-center justify-center p-4"
        aria-hidden="true">

        <div class="modal__overlay absolute inset-0 bg-slate-900/60 backdrop-blur-sm" aria-hidden="true"></div>

        <div class="modal__content relative z-10 flex max-h-[calc(100vh-2rem)] w-full max-w-4xl flex-col overflow-hidden rounded-2xl bg-white shadow-2xl"
            role="dialog" aria-modal="true" aria-labelledby="modal-titulo">

            <header class="flex items-center justify-between gap-4 border-b border-slate-200 px-5 py-4 sm:px-6">

                <h2 id="modal-titulo" class="flex items-center gap-2 text-lg font-bold text-slate-900">

                    <i class="fa-solid fa-calendar-plus text-blue-600" aria-hidden="true"></i>

                    Novo Agendamento
                </h2>

                <button type="button" id="modal-close" aria-label="Fechar modal de agendamento"
                    class="grid h-9 w-9 place-items-center rounded-lg text-slate-500 transition hover:bg-slate-100 hover:text-slate-900 focus:outline-none focus:ring-4 focus:ring-blue-100">

                    <i class="fa-solid fa-xmark" aria-hidden="true"></i>
                </button>
            </header>

            <form id="form-agendamento" class="overflow-y-auto px-5 py-5 sm:px-6" novalidate>

                <input type="hidden" id="agendamento-id">

                <div class="grid grid-cols-1 gap-5 lg:grid-cols-3">

                    <div class="lg:col-span-2">
                        <label for="paciente-nome" class="mb-1.5 block text-sm font-semibold text-slate-700">

                            Paciente *
                        </label>

                        <div class="relative">
                            <input type="text" id="paciente-nome" required autocomplete="off"
                                placeholder="Buscar por nome ou CPF"
                                class="modal__input h-11 w-full rounded-lg border border-slate-300 bg-white px-3 pr-12 text-sm text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-blue-500 focus:ring-4 focus:ring-blue-100">

                            <button type="button" aria-label="Buscar paciente"
                                class="absolute right-1 top-1/2 grid h-9 w-9 -translate-y-1/2 place-items-center rounded-md text-slate-500 transition hover:bg-slate-100 hover:text-blue-600">

                                <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                            </button>
                        </div>
                    </div>

                    <div>
                        <label for="agendamento-medico" class="mb-1.5 block text-sm font-semibold text-slate-700">

                            Médico *
                        </label>

                        <select id="agendamento-medico" required
                            class="modal__input h-11 w-full rounded-lg border border-slate-300 bg-white px-3 text-sm text-slate-800 outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-100">

                            <option value="">
                                Selecione
                            </option>

                            <option value="1">
                                Dr. Carlos Silva
                            </option>

                            <option value="2">
                                Dra. Ana Paula
                            </option>

                            <option value="3">
                                Dr. Roberto Lima
                            </option>
                        </select>
                    </div>

                    <div>
                        <label for="agendamento-data" class="mb-1.5 block text-sm font-semibold text-slate-700">

                            Data *
                        </label>

                        <input type="date" id="agendamento-data" required
                            class="modal__input h-11 w-full rounded-lg border border-slate-300 bg-white px-3 text-sm text-slate-800 outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-100">
                    </div>

                    <div>
                        <label for="agendamento-hora" class="mb-1.5 block text-sm font-semibold text-slate-700">

                            </option>

                    </div>

                    <div>
                        <label for="agendamento-convenio" class="mb-1.5 block text-sm font-semibold text-slate-700">

                            Convênio
                        </label>

                        <select id="agendamento-convenio"
                            class="modal__input h-11 w-full rounded-lg border border-slate-300 bg-white px-3 text-sm text-slate-800 outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-100">

                            <option value="particular">
                                Particular
                            </option>

                            <option value="unimed">
                                Unimed
                            </option>

                            <option value="sulamerica">
                                SulAmérica
                            </option>

                            <option value="bradesco">
                                Bradesco Saúde
                            </option>

                            <option value="hapvida">
                                Hapvida
                            </option>

                            <option value="amil">
                                Amil
                            </option>

                            <option value="medservice">
                                MedService
                            </option>

                            <option value="notredame">
                                NotreDame Intermédica
                            </option>

                            <option value="porto-seguro">
                                Porto Seguro Saúde
                            </option>

                            <option value="golden-cross">
                                Golden Cross
                            </option>

                            <option value="omint">
                                Omint
                            </option>

                            <option value="geap">
                                GEAP Saúde
                            </option>

                            <option value="cassi">
                                CASSI
                            </option>
                        </select>
                    </div>

                    <div>
                        <label for="agendamento-status" class="mb-1.5 block text-sm font-semibold text-slate-700">

                            Status
                        </label>

                        <select id="agendamento-status"
                            class="modal__input h-11 w-full rounded-lg border border-slate-300 bg-white px-3 text-sm text-slate-800 outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-100">

                            <option value="agendado" selected>
                                Agendado
                            </option>

                            <option value="confirmado">
                                Confirmado
                            </option>

                            <option value="espera">
                                Em Espera
                            </option>

                            <option value="atendido">
                                Atendido
                            </option>

                            <option value="cancelado">
                                Cancelado
                            </option>

                            <option value="nao-compareceu">
                                Não Compareceu
                            </option>
                        </select>
                    </div>

                    <div class="lg:col-span-3">
                        <label for="agendamento-obs" class="mb-1.5 block text-sm font-semibold text-slate-700">

                            Observações
                        </label>

                        <textarea id="agendamento-obs" rows="4" maxlength="1000" placeholder="Informações adicionais..."
                            class="modal__input w-full resize-y rounded-lg border border-slate-300 bg-white px-3 py-3 text-sm text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-blue-500 focus:ring-4 focus:ring-blue-100"></textarea>
                    </div>

                    <div class="lg:col-span-3">
                        <label class="inline-flex cursor-pointer items-center gap-3">
                            <input type="checkbox" id="agendamento-lembrete" checked
                                class="h-4 w-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500">

                            <span class="text-sm text-slate-600">
                                Enviar lembrete automático por WhatsApp/SMS
                            </span>
                        </label>
                    </div>
                </div>
            </form>

            <footer
                class="flex flex-col-reverse gap-3 border-t border-slate-200 px-5 py-4 sm:flex-row sm:justify-end sm:px-6">

                <button type="button" id="btn-cancelar"
                    class="inline-flex h-11 items-center justify-center rounded-lg border border-slate-300 px-5 text-sm font-semibold text-slate-700 transition hover:bg-slate-50 focus:outline-none focus:ring-4 focus:ring-slate-100">

                    Cancelar
                </button>

                <button type="submit" form="form-agendamento" id="btn-gravar"
                    class="inline-flex h-11 items-center justify-center gap-2 rounded-lg bg-blue-600 px-5 text-sm font-bold text-white transition hover:bg-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-200">

                    <i class="fa-solid fa-floppy-disk" aria-hidden="true"></i>

                    Gravar
                </button>
            </footer>
        </div>
    </div>

    <!-- =====================================================
         MODAL: AÇÕES DO AGENDAMENTO
         ===================================================== -->

    <div id="modal-acoes" class="modal modal--sm fixed inset-0 z-50 hidden items-center justify-center p-4"
        aria-hidden="true">

        <div class="modal__overlay absolute inset-0 bg-slate-900/60 backdrop-blur-sm" aria-hidden="true"></div>

        <div class="modal__content relative z-10 flex max-h-[calc(100vh-2rem)] w-full max-w-lg flex-col overflow-hidden rounded-2xl bg-white shadow-2xl"
            role="dialog" aria-modal="true" aria-labelledby="modal-acoes-titulo">

            <header class="flex items-center justify-between gap-4 border-b border-slate-200 px-5 py-4">

                <h2 id="modal-acoes-titulo" class="text-lg font-bold text-slate-900">

                    Ações do Agendamento
                </h2>

                <button type="button" id="modal-acoes-close" aria-label="Fechar ações do agendamento"
                    class="grid h-9 w-9 place-items-center rounded-lg text-slate-500 transition hover:bg-slate-100 hover:text-slate-900 focus:outline-none focus:ring-4 focus:ring-blue-100">

                    <i class="fa-solid fa-xmark" aria-hidden="true"></i>
                </button>
            </header>

            <div class="overflow-y-auto p-5">

                <div id="agendamento-detalhes" class="mb-5" aria-live="polite">

                    <!-- Conteúdo preenchido pelo JavaScript -->
                </div>

                <nav class="grid grid-cols-1 gap-2 sm:grid-cols-2" aria-label="Ações disponíveis para o agendamento">

                    <button type="button" data-acao="confirmar"
                        class="modal__acao inline-flex h-11 items-center gap-2 rounded-lg bg-green-50 px-4 text-sm font-semibold text-green-700 transition hover:bg-green-100">

                        <i class="fa-solid fa-check" aria-hidden="true"></i>

                        Confirmar
                    </button>

                    <button type="button" data-acao="espera"
                        class="modal__acao inline-flex h-11 items-center gap-2 rounded-lg bg-amber-50 px-4 text-sm font-semibold text-amber-700 transition hover:bg-amber-100">

                        <i class="fa-solid fa-hourglass-start" aria-hidden="true"></i>

                        Em Espera
                    </button>

                    <button type="button" data-acao="atender"
                        class="modal__acao inline-flex h-11 items-center gap-2 rounded-lg bg-cyan-50 px-4 text-sm font-semibold text-cyan-700 transition hover:bg-cyan-100">

                        <i class="fa-solid fa-stethoscope" aria-hidden="true"></i>

                        Atender
                    </button>

                    <button type="button" data-acao="teleconsulta"
                        class="modal__acao inline-flex h-11 items-center gap-2 rounded-lg bg-indigo-50 px-4 text-sm font-semibold text-indigo-700 transition hover:bg-indigo-100">

                        <i class="fa-solid fa-video" aria-hidden="true"></i>

                        Teleconsulta
                    </button>

                    <button type="button" data-acao="prontuario"
                        class="modal__acao inline-flex h-11 items-center gap-2 rounded-lg bg-blue-50 px-4 text-sm font-semibold text-blue-700 transition hover:bg-blue-100">

                        <i class="fa-solid fa-file-medical" aria-hidden="true"></i>

                        Prontuário
                    </button>

                    <button type="button" data-acao="financeiro"
                        class="modal__acao inline-flex h-11 items-center gap-2 rounded-lg bg-emerald-50 px-4 text-sm font-semibold text-emerald-700 transition hover:bg-emerald-100">

                        <i class="fa-solid fa-dollar-sign" aria-hidden="true"></i>

                        Financeiro
                    </button>

                    <button type="button" data-acao="editar"
                        class="modal__acao inline-flex h-11 items-center gap-2 rounded-lg bg-slate-100 px-4 text-sm font-semibold text-slate-700 transition hover:bg-slate-200">

                        <i class="fa-solid fa-pen" aria-hidden="true"></i>

                        Editar
                    </button>

                    <button type="button" data-acao="cancelar"
                        class="modal__acao inline-flex h-11 items-center gap-2 rounded-lg bg-orange-50 px-4 text-sm font-semibold text-orange-700 transition hover:bg-orange-100">

                        <i class="fa-solid fa-ban" aria-hidden="true"></i>

                        Cancelar
                    </button>

                    <button type="button" data-acao="excluir"
                        class="modal__acao inline-flex h-11 items-center gap-2 rounded-lg bg-red-50 px-4 text-sm font-semibold text-red-700 transition hover:bg-red-100 sm:col-span-2">

                        <i class="fa-solid fa-trash" aria-hidden="true"></i>

                        Excluir Agendamento
                    </button>
                </nav>
            </div>
        </div>
    </div>

    <!-- =====================================================
         TOASTS
         ===================================================== -->

    <div id="toast-container" aria-live="polite" aria-atomic="true"
        class="fixed bottom-4 right-4 z-[100] flex w-[calc(100%-2rem)] max-w-sm flex-col gap-3">
    </div>

    <!-- JavaScript da agenda -->
    <script src="agenda-geral.js"></script>
</body>

</html>
