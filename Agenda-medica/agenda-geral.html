<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Agenda médica do sistema G4Med">

    <title>G4Med - Agenda Médica</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#F0FDFA',
                            100: '#CCFBF1',
                            200: '#99F6E4',
                            300: '#5EEAD4',
                            400: '#2DD4BF',
                            500: '#14B8A6',
                            600: '#0D9488',
                            700: '#0F766E',
                            800: '#115E59',
                            900: '#134E4A'
                        }
                    },
                    fontFamily: {
                        sans: [
                            'Plus Jakarta Sans',
                            'ui-sans-serif',
                            'system-ui',
                            'sans-serif'
                        ]
                    },
                    boxShadow: {
                        soft: '0 8px 24px rgb(15 23 42 / 8%)'
                    }
                }
            }
        };
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- CSS externo -->
    <link rel="stylesheet" href="agenda-geral.css">
</head>

<body>

    <!-- =====================================================
         CABEÇALHO
         ===================================================== -->

    <header class="agenda__header">

        <div class="agenda__header-left">

            <a href="../Menu-Principal.html" class="agenda__btn agenda__btn--voltar">

                <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>

                <span>Voltar</span>
            </a>

            <div class="agenda__nav-data">

                <button type="button" id="btn-prev" class="agenda__btn agenda__btn--icon"
                    aria-label="Visualizar dia anterior">

                    <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
                </button>

                <div class="agenda__data-display" aria-live="polite" aria-atomic="true">

                    <i class="fa-regular fa-calendar" aria-hidden="true"></i>

                    <div class="agenda__data-texto">
                        <strong id="current-date-label">
                            Carregando...
                        </strong>

                        <span id="current-weekday"></span>
                    </div>
                </div>

                <button type="button" id="btn-next" class="agenda__btn agenda__btn--icon"
                    aria-label="Visualizar próximo dia">

                    <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
                </button>

                <button type="button" id="btn-today" class="agenda__btn agenda__btn--hoje">

                    <i class="fa-regular fa-calendar" aria-hidden="true"></i>

                    <span>Hoje</span>
                </button>
            </div>
        </div>

        <div class="agenda__header-right">

            <div class="agenda__filtros">

                <div class="agenda__select-wrap">
                    <label for="filter-medico" class="sr-only">

                        Filtrar por médico
                    </label>

                    <select id="filter-medico" class="agenda__select" aria-label="Filtrar agenda por médico">

                        <option value="">
                            Todos os Médicos
                        </option>

                        <option value="1">
                            Dr. Carlos Silva
                        </option>

                        <option value="2">
                            Dra. Ana Paula
                        </option>

                        <option value="3">
                            Dr. Roberto Lima
                        </option>
                    </select>

                    <i class="agenda__select-arrow fa-solid fa-chevron-down" aria-hidden="true"></i>
                </div>

                <div class="agenda__select-wrap">
                    <label for="filter-especialidade" class="sr-only">

                        Filtrar por especialidade
                    </label>

                    <select id="filter-especialidade" class="agenda__select"
                        aria-label="Filtrar agenda por especialidade">

                        <option value="">
                            Todas Especialidades
                        </option>

                        <optgroup label="Clínicas e Consultas">
                            <option value="alergia">Alergologia e Imunologia</option>
                            <option value="cardio">Cardiologia</option>
                            <option value="clinica">Clínica Médica</option>
                            <option value="derma">Dermatologia</option>
                            <option value="endo">Endocrinologia e Metabologia</option>
                            <option value="gastro">Gastroenterologia</option>
                            <option value="geriatria">Geriatria</option>
                            <option value="infecto">Infectologia</option>
                            <option value="med-familia">Medicina de Família e Comunidade</option>
                            <option value="med-esporte">Medicina do Esporte</option>
                            <option value="nefro">Nefrologia</option>
                            <option value="neuro">Neurologia</option>
                            <option value="nutrologia">Nutrologia</option>
                            <option value="pediatria">Pediatria</option>
                            <option value="pneumo">Pneumologia</option>
                            <option value="psiquiatria">Psiquiatria</option>
                            <option value="reumato">Reumatologia</option>
                        </optgroup>

                        <optgroup label="Cirurgias">
                            <option value="cirurgia-cabeca">Cirurgia de Cabeça e Pescoço</option>
                            <option value="cirurgia-cardio">Cirurgia Cardiovascular</option>
                            <option value="cirurgia-geral">Cirurgia Geral</option>
                            <option value="cirurgia-plastica">Cirurgia Plástica</option>
                            <option value="cirurgia-toracica">Cirurgia Torácica</option>
                            <option value="cirurgia-vascular">Cirurgia Vascular</option>
                            <option value="coloprocto">Coloproctologia</option>
                            <option value="mastologia">Mastologia</option>
                            <option value="oftalmo">Oftalmologia</option>
                            <option value="orto">Ortopedia e Traumatologia</option>
                            <option value="otorrino">Otorrinolaringologia</option>
                            <option value="urologia">Urologia</option>
                        </optgroup>

                        <optgroup label="Diagnóstico e Outros">
                            <option value="acupuntura">Acupuntura</option>
                            <option value="anestesia">Anestesiologia</option>
                            <option value="endoscopia">Endoscopia</option>
                            <option value="fisio">Fisiatria</option>
                            <option value="genetica">Genética Médica</option>
                            <option value="gineco">Ginecologia e Obstetrícia</option>
                            <option value="hematologia">Hematologia e Hemoterapia</option>
                            <option value="homeopatia">Homeopatia</option>
                            <option value="med-trabalho">Medicina do Trabalho</option>
                            <option value="med-trafego">Medicina de Tráfego</option>
                            <option value="oncologia">Oncologia</option>
                            <option value="patologia">Patologia</option>
                            <option value="radiologia">Radiologia e Diagnóstico por Imagem</option>
                        </optgroup>
                    </select>

                    <i class="agenda__select-arrow fa-solid fa-chevron-down" aria-hidden="true"></i>
                </div>
            </div>

            <button type="button" id="btn-novo-agendamento" class="agenda__btn agenda__btn--primary">

                <i class="fa-solid fa-plus" aria-hidden="true"></i>

                <span>Novo Agendamento</span>
            </button>
        </div>
    </header>

    <!-- =====================================================
         LEGENDA
         ===================================================== -->

    <section class="agenda__legend" aria-label="Legenda dos status dos agendamentos">

        <span class="agenda__legend-item">
            <span class="agenda__dot agenda__dot--agendado"></span>
            Agendado
        </span>

        <span class="agenda__legend-item">
            <span class="agenda__dot agenda__dot--confirmado"></span>
            Confirmado
        </span>

        <span class="agenda__legend-item">
            <span class="agenda__dot agenda__dot--espera"></span>
            Em Espera
        </span>

        <span class="agenda__legend-item">
            <span class="agenda__dot agenda__dot--atendido"></span>
            Atendido
        </span>

        <span class="agenda__legend-item">
            <span class="agenda__dot agenda__dot--cancelado"></span>
            Cancelado
        </span>

        <span class="agenda__legend-item">
            <span class="agenda__dot agenda__dot--nao-compareceu"></span>
            Não Compareceu
        </span>
    </section>

    <!-- =====================================================
         CALENDÁRIO
         ===================================================== -->

    <main>

        <section class="agenda__calendar" aria-label="Grade de agendamentos médicos">

            <div id="agenda-header" class="agenda__calendar-header" aria-label="Profissionais da agenda">

                <div class="agenda__col-time">
                    Horário
                </div>

                <div class="agenda__col-prof" data-medico="1">

                    <span class="agenda__prof-nome">
                        Dr. Carlos Silva
                    </span>

                    <span class="agenda__prof-esp">
                        Cardiologia
                    </span>
                </div>

                <div class="agenda__col-prof" data-medico="2">

                    <span class="agenda__prof-nome">
                        Dra. Ana Paula
                    </span>

                    <span class="agenda__prof-esp">
                        Dermatologia
                    </span>
                </div>

                <div class="agenda__col-prof" data-medico="3">

                    <span class="agenda__prof-nome">
                        Dr. Roberto Lima
                    </span>

                    <span class="agenda__prof-esp">
                        Ortopedia e Traumatologia
                    </span>
                </div>
            </div>

            <div id="agenda-body" class="agenda__calendar-body" aria-live="polite" aria-atomic="false">

                <div class="agenda__empty">
                    Carregando agenda...
                </div>
            </div>
        </section>
    </main>

    <!-- =====================================================
         MODAL: NOVO OU EDITAR AGENDAMENTO
         ===================================================== -->

    <div id="modal-agendamento" class="modal" aria-hidden="true">

        <div class="modal__overlay" aria-hidden="true"></div>

        <div class="modal__content" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">

            <header class="modal__header">

                <h2 id="modal-titulo">
                    <i class="fa-solid fa-calendar-plus" aria-hidden="true"></i>

                    <span>Novo Agendamento</span>
                </h2>

                <button type="button" id="modal-close" class="modal__close" aria-label="Fechar modal de agendamento">

                    <i class="fa-solid fa-xmark" aria-hidden="true"></i>
                </button>
            </header>

            <form id="form-agendamento" class="modal__form" novalidate>

                <input type="hidden" id="agendamento-id">

                <div class="modal__row">

                    <div class="modal__field modal__field--2">
                        <label for="paciente-nome" class="modal__label">

                            Paciente *
                        </label>

                        <div class="modal__input-group">
                            <input type="text" id="paciente-nome" class="modal__input" required autocomplete="off"
                                placeholder="Buscar por nome ou CPF">

                            <button type="button" class="modal__input-btn" aria-label="Buscar paciente">

                                <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                            </button>
                        </div>
                    </div>

                    <div class="modal__field">
                        <label for="agendamento-medico" class="modal__label">

                            Médico *
                        </label>

                        <select id="agendamento-medico" class="modal__input" required>

                            <option value="">
                                Selecione
                            </option>

                            <option value="1">
                                Dr. Carlos Silva
                            </option>

                            <option value="2">
                                Dra. Ana Paula
                            </option>

                            <option value="3">
                                Dr. Roberto Lima
                            </option>
                        </select>
                    </div>
                </div>

                <div class="modal__row">

                    <div class="modal__field">
                        <label for="agendamento-data" class="modal__label">

                            Data *
                        </label>

                        <input type="date" id="agendamento-data" class="modal__input" required>
                    </div>

                    <div class="modal__field">
                        <label for="agendamento-hora" class="modal__label">

                            Horário da Chegada *
                        </label>

                        <input type="time" id="agendamento-hora" class="modal__input" min="08:00" max="17:30" step="300"
                            required>
                    </div>

                    <div class="modal__field">
                        <label for="agendamento-duracao" class="modal__label">

                            Duração
                        </label>

                        <select id="agendamento-duracao" class="modal__input">

                            <option value="15">15 min</option>
                            <option value="30" selected>30 min</option>
                            <option value="45">45 min</option>
                            <option value="60">60 min</option>
                            <option value="90">90 min</option>
                        </select>
                    </div>
                </div>

                <div class="modal__row">

                    <div class="modal__field">
                        <label for="agendamento-tipo" class="modal__label">

                            Tipo de Atendimento *
                        </label>

                        <select id="agendamento-tipo" class="modal__input" required>

                            <option value="presencial">
                                Presencial
                            </option>

                            <option value="online">
                                Online — Teleconsulta
                            </option>

                            <option value="retorno">
                                Retorno
                            </option>

                            <option value="procedimento">
                                Procedimento
                            </option>
                        </select>
                    </div>

                    <div class="modal__field">
                        <label for="agendamento-convenio" class="modal__label">

                            Convênio
                        </label>

                        <select id="agendamento-convenio" class="modal__input">

                            <option value="particular">Particular</option>
                            <option value="unimed">Unimed</option>
                            <option value="sulamerica">SulAmérica</option>
                            <option value="bradesco">Bradesco Saúde</option>
                            <option value="hapvida">Hapvida</option>
                            <option value="amil">Amil</option>
                            <option value="medservice">MedService</option>
                            <option value="notredame">NotreDame Intermédica</option>
                            <option value="porto-seguro">Porto Seguro Saúde</option>
                            <option value="golden-cross">Golden Cross</option>
                            <option value="omint">Omint</option>
                            <option value="geap">GEAP Saúde</option>
                            <option value="cassi">CASSI</option>
                        </select>
                    </div>

                    <div class="modal__field">
                        <label for="agendamento-status" class="modal__label">

                            Status
                        </label>

                        <select id="agendamento-status" class="modal__input">

                            <option value="agendado" selected>Agendado</option>
                            <option value="confirmado">Confirmado</option>
                            <option value="espera">Em Espera</option>
                            <option value="atendido">Atendido</option>
                            <option value="cancelado">Cancelado</option>
                            <option value="nao-compareceu">Não Compareceu</option>
                        </select>
                    </div>
                </div>

                <div class="modal__row">

                    <div class="modal__field modal__field--full">
                        <label for="agendamento-obs" class="modal__label">

                            Observações
                        </label>

                        <textarea id="agendamento-obs" class="modal__input modal__input--area" rows="4" maxlength="1000"
                            placeholder="Informações adicionais..."></textarea>
                    </div>
                </div>

                <div class="modal__row modal__row--checkbox">

                    <label class="modal__checkbox" for="agendamento-lembrete">

                        <input type="checkbox" id="agendamento-lembrete" checked>

                        <span>
                            Enviar lembrete automático por WhatsApp/SMS
                        </span>
                    </label>
                </div>
            </form>

            <footer class="modal__footer">

                <button type="button" id="btn-cancelar" class="agenda__btn agenda__btn--secondary">

                    Cancelar
                </button>

                <button type="submit" form="form-agendamento" id="btn-gravar" class="agenda__btn agenda__btn--primary">

                    <i class="fa-solid fa-floppy-disk" aria-hidden="true"></i>

                    <span>Gravar</span>
                </button>
            </footer>
        </div>
    </div>

    <!-- =====================================================
         MODAL: AÇÕES DO AGENDAMENTO
         ===================================================== -->

    <div id="modal-acoes" class="modal modal--sm" aria-hidden="true">

        <div class="modal__overlay" aria-hidden="true"></div>

        <div class="modal__content" role="dialog" aria-modal="true" aria-labelledby="modal-acoes-titulo">

            <header class="modal__header">

                <h2 id="modal-acoes-titulo">
                    Ações do Agendamento
                </h2>

                <button type="button" id="modal-acoes-close" class="modal__close"
                    aria-label="Fechar ações do agendamento">

                    <i class="fa-solid fa-xmark" aria-hidden="true"></i>
                </button>
            </header>

            <div class="modal__body">

                <div id="agendamento-detalhes" class="modal__details" aria-live="polite">
                </div>

                <nav class="modal__acoes" aria-label="Ações disponíveis para o agendamento">

                    <button type="button" data-acao="confirmar" class="modal__acao modal__acao--confirmar">

                        <i class="fa-solid fa-check" aria-hidden="true"></i>

                        <span>Confirmar</span>
                    </button>

                    <button type="button" data-acao="espera" class="modal__acao modal__acao--espera">

                        <i class="fa-solid fa-hourglass-start" aria-hidden="true"></i>

                        <span>Em Espera</span>
                    </button>

                    <button type="button" data-acao="atender" class="modal__acao modal__acao--atender">

                        <i class="fa-solid fa-stethoscope" aria-hidden="true"></i>

                        <span>Atender</span>
                    </button>

                    <button type="button" data-acao="teleconsulta" class="modal__acao modal__acao--teleconsulta">

                        <i class="fa-solid fa-video" aria-hidden="true"></i>

                        <span>Teleconsulta</span>
                    </button>

                    <button type="button" data-acao="prontuario" class="modal__acao modal__acao--prontuario">

                        <i class="fa-solid fa-file-medical" aria-hidden="true"></i>

                        <span>Prontuário</span>
                    </button>

                    <button type="button" data-acao="financeiro" class="modal__acao modal__acao--financeiro">

                        <i class="fa-solid fa-dollar-sign" aria-hidden="true"></i>

                        <span>Financeiro</span>
                    </button>

                    <button type="button" data-acao="editar" class="modal__acao modal__acao--editar">

                        <i class="fa-solid fa-pen" aria-hidden="true"></i>

                        <span>Editar</span>
                    </button>

                    <button type="button" data-acao="cancelar" class="modal__acao modal__acao--cancelar">

                        <i class="fa-solid fa-ban" aria-hidden="true"></i>

                        <span>Cancelar</span>
                    </button>

                    <button type="button" data-acao="excluir" class="modal__acao modal__acao--excluir">

                        <i class="fa-solid fa-trash" aria-hidden="true"></i>

                        <span>Excluir Agendamento</span>
                    </button>
                </nav>
            </div>
        </div>
    </div>

    <!-- Toasts -->
    <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="true">
    </div>

    <!-- JavaScript externo -->
    <script src="agenda-geral.js"></script>
</body>

</html>
