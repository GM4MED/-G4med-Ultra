<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G4med - Agenda Médica</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="agenda.css">
</head>

<body>
    <!-- =====================================================
         HEADER / TOOLBAR SUPERIOR
         ===================================================== -->
    <header class="agenda__header">
        <div class="agenda__header-left">
            <a href="../Menu-Principal.html" class="agenda__btn agenda__btn--voltar"
                style="text-decoration: none; display: inline-flex; align-items: center;">
                <i class="fa-solid fa-arrow-left"></i>
                <span>Voltar</span>
            </a>

            <div class="agenda__nav-data">
                <button class="agenda__btn agenda__btn--icon" id="btn-prev" aria-label="Dia anterior">
                    <i class="fa-solid fa-chevron-left"></i>
                </button>
                <div class="agenda__data-display">
                    <i class="fa-regular fa-calendar"></i>
                    <div class="agenda__data-texto">
                        <strong id="current-date-label">Carregando...</strong>
                        <span id="current-weekday"></span>
                    </div>
                </div>

                <button class="agenda__btn agenda__btn--icon" id="btn-next" aria-label="Próximo dia">
                    <i class="fa-solid fa-chevron-right"></i>
                </button>

                <button class="agenda__btn agenda__btn--hoje" id="btn-today">
                    <i class="fa-regular fa-calendar"></i>
                    <span>Hoje</span>
                </button>
            </div>
        </div>

        <div class="agenda__header-right">
            <div class="agenda__filtros">
                <div class="agenda__select-wrap">
                    <select id="filter-medico" class="agenda__select">
                        <option value="">Todos os Médicos</option>
                        <option value="1">Dr. Carlos Silva</option>
                        <option value="2">Dra. Ana Paula</option>
                        <option value="3">Dr. Roberto Lima</option>
                    </select>
                    <i class="fa-solid fa-chevron-down agenda__select-arrow"></i>
                </div>

                <div class="agenda__select-wrap">
                    <select id="filter-especialidade" class="agenda__select">
                        <option value="">Todas Especialidades</option>
                        <optgroup label="Clínicas e Consultas">
                            <option value="alergia">Alergologia e Imunologia</option>
                            <option value="cardio">Cardiologia</option>
                            <option value="clinica">Clínica Médica</option>
                            <option value="derma">Dermatologia</option>
                            <option value="endo">Endocrinologia e Metabologia</option>
                            <option value="gastro">Gastroenterologia</option>
                            <option value="geriatria">Geriatria</option>
                            <option value="infecto">Infectologia</option>
                            <option value="med-familia">Medicina de Família e Comunidade</option>
                            <option value="med-esporte">Medicina do Esporte</option>
                            <option value="nefro">Nefrologia</option>
                            <option value="neuro">Neurologia</option>
                            <option value="nutrologia">Nutrologia</option>
                            <option value="pediatria">Pediatria</option>
                            <option value="pneumo">Pneumologia</option>
                            <option value="psiquiatria">Psiquiatria</option>
                            <option value="reumato">Reumatologia</option>
                        </optgroup>

                        <optgroup label="Cirurgias">
                            <option value="cirurgia-cabeça">Cirurgia de Cabeça e Pescoço</option>
                            <option value="cirurgia-cardio">Cirurgia Cardiovascular</option>
                            <option value="cirurgia-geral">Cirurgia Geral</option>
                            <option value="cirurgia-plastica">Cirurgia Plástica</option>
                            <option value="cirurgia-toracica">Cirurgia Torácica</option>
                            <option value="cirurgia-vascular">Cirurgia Vascular</option>
                            <option value="coloprocto">Coloproctologia</option>
                            <option value="mastologia">Mastologia</option>
                            <option value="oftalmo">Oftalmologia</option>
                            <option value="orto">Ortopedia e Traumatologia</option>
                            <option value="otorrino">Otorrinolaringologia</option>
                            <option value="urologia">Urologia</option>
                        </optgroup>

                        <optgroup label="Diagnóstico e Outros">
                            <option value="acupuntura">Acupuntura</option>
                            <option value="anestesia">Anestesiologia</option>
                            <option value="endoscopia">Endoscopia</option>
                            <option value="fisio">Fisiatria</option>
                            <option value="genetica">Genética Médica</option>
                            <option value="gineco">Ginecologia e Obstetrícia</option>
                            <option value="hematologia">Hematologia e Hemoterapia</option>
                            <option value="homeopatia">Homeopatia</option>
                            <option value="med-trabalho">Medicina do Trabalho</option>
                            <option value="med-trafego">Medicina de Tráfego</option>
                            <option value="oncologia">Oncologia</option>
                            <option value="patologia">Patologia</option>
                            <option value="radiologia">Radiologia e Diagnóstico por Imagem</option>
                        </optgroup>
                    </select>
                    <i class="fa-solid fa-chevron-down agenda__select-arrow"></i>
                </div>
            </div>

            <button class="agenda__btn agenda__btn--primary" id="btn-novo-agendamento">
                <i class="fa-solid fa-plus"></i>
                <span>Novo Agendamento</span>
            </button>
        </div>
    </header>

    <!-- =====================================================
         LEGENDA DE STATUS
         ===================================================== -->
    <section class="agenda__legend">
        <span class="agenda__legend-item">
            <span class="agenda__dot agenda__dot--agendado"></span> Agendado
        </span>
        <span class="agenda__legend-item">
            <span class="agenda__dot agenda__dot--confirmado"></span> Confirmado
        </span>
        <span class="agenda__legend-item">
            <span class="agenda__dot agenda__dot--espera"></span> Em Espera
        </span>
        <span class="agenda__legend-item">
            <span class="agenda__dot agenda__dot--atendido"></span> Atendido
        </span>
        <span class="agenda__legend-item">
            <span class="agenda__dot agenda__dot--cancelado"></span> Cancelado
        </span>
        <span class="agenda__legend-item">
            <span class="agenda__dot agenda__dot--nao-compareceu"></span> Não Compareceu
        </span>
    </section>

    <!-- =====================================================
         GRADE DE AGENDA
         ===================================================== -->
    <main class="agenda__calendar">
        <div class="agenda__calendar-header" id="agenda-header">
            <div class="agenda__col-time">Horário</div>
            <div class="agenda__col-prof" data-medico="1">
                <span class="agenda__prof-nome">Dr. Carlos Silva</span>
                <span class="agenda__prof-esp">Cardiologia</span>
            </div>
            <div class="agenda__col-prof" data-medico="2">
                <span class="agenda__prof-nome">Dra. Ana Paula</span>
                <span class="agenda__prof-esp">Dermatologia</span>
            </div>
            <div class="agenda__col-prof" data-medico="3">
                <span class="agenda__prof-nome">Dr. Roberto Lima</span>
                <span class="agenda__prof-esp">Ortopedia</span>
            </div>
        </div>

        <div class="agenda__calendar-body" id="agenda-body">
            <!-- Slots renderizados via JS -->
        </div>
    </main>

    <!-- =====================================================
         MODAL: NOVO / EDITAR AGENDAMENTO
         ===================================================== -->
    <div class="modal" id="modal-agendamento" aria-hidden="true">
        <div class="modal__overlay"></div>
        <div class="modal__content" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
            <header class="modal__header">
                <h2 id="modal-titulo"><i class="fa-solid fa-calendar-plus"></i> Novo Agendamento</h2>
                <button class="modal__close" id="modal-close" aria-label="Fechar modal">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </header>

            <form class="modal__form" id="form-agendamento" novalidate>
                <input type="hidden" id="agendamento-id">

                <div class="modal__row">
                    <div class="modal__field modal__field--2">
                        <label class="modal__label" for="paciente-nome">Paciente *</label>
                        <div class="modal__input-group">
                            <input type="text" id="paciente-nome" class="modal__input"
                                placeholder="Buscar por nome ou CPF" required>
                            <button type="button" class="modal__input-btn" aria-label="Buscar paciente">
                                <i class="fa-solid fa-magnifying-glass"></i>
                            </button>
                        </div>
                    </div>

                    <div class="modal__field">
                        <label class="modal__label" for="agendamento-medico">Médico *</label>
                        <select id="agendamento-medico" class="modal__input" required>
                            <option value="">Selecione</option>
                            <option value="1">Dr. Carlos Silva</option>
                            <option value="2">Dra. Ana Paula</option>
                            <option value="3">Dr. Roberto Lima</option>
                        </select>
                    </div>
                </div>
                <div class="modal__row">
                    <div class="modal__field">
                        <label class="modal__label" for="agendamento-data">Data *</label>
                        <input type="date" id="agendamento-data" class="modal__input" required>
                    </div>
                    <div class="input-group">
                        <label for="agendamento-hora">Horário da Chegada (24h)</label>
                        <div style="display: flex; gap: 5px;">
                            <input type="time" id="agendamento-hora" class="modal__input" required>
                        </div>
                    </div>
                    <div class="modal__field">
                        <label class="modal__label" for="agendamento-duracao">Duração</label>
                        <select id="agendamento-duracao" class="modal__input">
                            <option value="15">15 min</option>
                            <option value="30" selected>30 min</option>
                            <option value="45">45 min</option>
                            <option value="60">60 min</option>
                            <option value="90">90 min</option>
                        </select>
                    </div>
                </div>

                <div class="modal__row">
                    <div class="modal__field">
                        <label class="modal__label" for="agendamento-tipo">Tipo de Atendimento *</label>
                        <select id="agendamento-tipo" class="modal__input" required>
                            <option value="presencial">Presencial</option>
                            <option value="online">Online (Teleconsulta)</option>
                            <option value="retorno">Retorno</option>
                            <option value="procedimento">Procedimento</option>
                        </select>
                    </div>
                    <div class="modal__field">
                        <label class="modal__label" for="agendamento-convenio">Convênio</label>
                        <select id="agendamento-convenio" class="modal__input">
                            <option value="particular">Particular</option>
                            <option value="unimed">Unimed</option>
                            <option value="sulamerica">SulAmérica</option>
                            <option value="bradesco">Bradesco Saúde</option>
                            <option value="hapvida">Hapvida</option>
                            <option value="amil">Amil</option>
                            <option value="medservice">MedService</option>
                            <option value="notredame">NotreDame Intermédica</option>
                            <option value="porto-seguro">Porto Seguro Saúde</option>
                            <option value="golden-cross">Golden Cross</option>
                            <option value="omint">Omint</option>
                            <option value="geap">GEAP Saúde</option>
                            <option value="cassi">CASSI</option>
                        </select>
                    </div>
                    <div class="modal__field">
                        <label class="modal__label" for="agendamento-status">Status</label>
                        <select id="agendamento-status" class="modal__input">
                            <option value="agendado" selected>Agendado</option>
                            <option value="confirmado">Confirmado</option>
                            <option value="espera">Em Espera</option>
                            <option value="atendido">Atendido</option>
                            <option value="cancelado">Cancelado</option>
                            <option value="nao-compareceu">Não Compareceu</option>
                        </select>
                    </div>
                </div>

                <div class="modal__row">
                    <div class="modal__field modal__field--full">
                        <label class="modal__label" for="agendamento-obs">Observações</label>
                        <textarea id="agendamento-obs" class="modal__input modal__input--area" rows="3"
                            placeholder="Informações adicionais..."></textarea>
                    </div>
                </div>

                <div class="modal__row modal__row--checkbox">
                    <label class="modal__checkbox">
                        <input type="checkbox" id="agendamento-lembrete" checked>
                        <span class="modal__checkmark"></span>
                        <span class="modal__checkbox-text">Enviar lembrete automático (WhatsApp/SMS)</span>
                    </label>
                </div>
            </form>

            <footer class="modal__footer">
                <button type="button" class="agenda__btn agenda__btn--secondary" id="btn-cancelar">Cancelar</button>
                <button type="button" class="agenda__btn agenda__btn--primary" id="btn-gravar">
                    <i class="fa-solid fa-floppy-disk"></i> Gravar
                </button>
            </footer>
        </div>
    </div>

    <!-- =====================================================
         MODAL: AÇÕES DO AGENDAMENTO
         ===================================================== -->
    <div class="modal modal--sm" id="modal-acoes" aria-hidden="true">
        <div class="modal__overlay"></div>
        <div class="modal__content" role="dialog" aria-modal="true">
            <header class="modal__header">
                <h2>Ações do Agendamento</h2>
                <button class="modal__close" id="modal-acoes-close" aria-label="Fechar modal">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </header>

            <div class="modal__body">
                <div class="modal__details" id="agendamento-detalhes">
                    <!-- preenchido via JS -->
                </div>

                <nav class="modal__acoes">
                    <button class="modal__acao modal__acao--confirmar" data-acao="confirmar">
                        <i class="fa-solid fa-check"></i> Confirmar
                    </button>
                    <button class="modal__acao modal__acao--espera" data-acao="espera">
                        <i class="fa-solid fa-hourglass-start"></i> Em Espera
                    </button>
                    <button class="modal__acao modal__acao--atender" data-acao="atender">
                        <i class="fa-solid fa-stethoscope"></i> Atender
                    </button>
                    <button class="modal__acao modal__acao--teleconsulta" data-acao="teleconsulta">
                        <i class="fa-solid fa-video"></i> Teleconsulta
                    </button>
                    <button class="modal__acao modal__acao--prontuario" data-acao="prontuario">
                        <i class="fa-solid fa-file-medical"></i> Prontuário
                    </button>
                    <button class="modal__acao modal__acao--financeiro" data-acao="financeiro">
                        <i class="fa-solid fa-dollar-sign"></i> Financeiro
                    </button>
                    <button class="modal__acao modal__acao--editar" data-acao="editar">
                        <i class="fa-solid fa-pen"></i> Editar
                    </button>
                    <button class="modal__acao modal__acao--cancelar" data-acao="cancelar">
                        <i class="fa-solid fa-ban"></i> Cancelar
                    </button>
                    <button class="modal__acao modal__acao--excluir" data-acao="excluir">
                        <i class="fa-solid fa-trash"></i> Excluir
                    </button>
                </nav>
            </div>
        </div>
    </div>

    <!-- =====================================================
         TOAST CONTAINER
         ===================================================== -->
    <div class="toast-container" id="toast-container" aria-live="polite" aria-atomic="true"></div>

    <script src="agenda.js"></script>
</body>

</html>
