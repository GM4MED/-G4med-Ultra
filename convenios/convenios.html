<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gestão de Convênios e Planos - Sistema GM4">
    <meta name="author" content="Sistema GM4">

    <title>Cadastro de Convênios | Sistema GM4</title>

    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome (Ícones) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Google Fonts (Plus Jakarta Sans) -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Configuração do Tailwind -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        teal: {
                            50: '#f0fdfa',
                            100: '#ccfbf1',
                            200: '#99f6e4',
                            300: '#5eead4',
                            400: '#2dd4bf',
                            500: '#14b8a6',
                            600: '#0d9488',
                            700: '#0f766e',
                            800: '#115e59',
                            900: '#134e4a',
                        }
                    }
                }
            }
        }
    </script>

    <!-- CSS Externo -->
    <link rel="stylesheet" href="./convenios.css">
</head>

<body>
    <div class="container-full">
        <!-- Header -->
        <header class="w-full">
            <div class="header-title">
                <i class="fas fa-handshake"></i>
                <h1>Gestão de Convênios e Planos</h1>
            </div>
            <div class="toolbar">
                <button id="btnNovo" class="btn btn-primary">
                    <i class="fas fa-plus"></i> Novo Convênio
                </button>
                <button id="btnSalvar" class="btn btn-success" disabled>
                    <i class="fas fa-save"></i> Gravar
                </button>
                <button id="btnEditar" class="btn btn-warning" disabled>
                    <i class="fas fa-edit"></i> Editar
                </button>
                <button id="btnExcluir" class="btn btn-danger" disabled>
                    <i class="fas fa-trash"></i> Excluir
                </button>
                <button id="btnSair" class="btn btn-dark" onclick="window.location.href='../Menu-Principal.html'">
                    <i class="fas fa-arrow-left"></i> Voltar
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="w-full">
            <!-- Área de Formulário com Abas -->
            <section class="form-area w-full">
                <nav class="tabs-nav w-full">
                    <button class="tab-link active" onclick="openTab(event, 'dados-gerais')">
                        <i class="fas fa-file-alt"></i> 1. Dados Gerais
                    </button>
                    <button class="tab-link" onclick="openTab(event, 'faturamento')">
                        <i class="fas fa-file-invoice-dollar"></i> 2. Faturamento & Tabelas
                    </button>
                    <button class="tab-link" onclick="openTab(event, 'contato-convenio')">
                        <i class="fas fa-address-book"></i> 3. Contatos & Suporte
                    </button>
                </nav>

                <div class="form-content w-full">
                    <form id="convenioForm">
                        <!-- Aba 1: Dados Gerais -->
                        <div id="dados-gerais" class="tab-content active w-full">
                            <div class="form-grid">
                                <div class="form-group col-2">
                                    <label for="convenioId">ID</label>
                                    <input type="text" id="convenioId" readonly placeholder="Auto">
                                </div>
                                <div class="form-group col-10">
                                    <label for="razaoSocial">Razão Social</label>
                                    <input type="text" id="razaoSocial" class="uppercase" disabled required>
                                </div>
                                <div class="form-group col-6">
                                    <label for="nomeFantasia">Nome Fantasia</label>
                                    <input type="text" id="nomeFantasia" class="uppercase" disabled required>
                                </div>
                                <div class="form-group col-3">
                                    <label for="cnpj">CNPJ</label>
                                    <input type="text" id="cnpj" disabled placeholder="00.000.000/0000-00">
                                </div>
                                <div class="form-group col-3">
                                    <label for="registroAns">Registro ANS</label>
                                    <input type="text" id="registroAns" disabled placeholder="000000-0">
                                </div>
                                <div class="form-group col-4">
                                    <label for="status">Status do Convênio</label>
                                    <select id="status" disabled>
                                        <option value="A">Ativo</option>
                                        <option value="I">Inativo/Suspenso</option>
                                    </select>
                                </div>
                                <div class="form-group col-8">
                                    <label for="urlPortal">Web-Service / Portal Autorizador</label>
                                    <input type="url" id="urlPortal" placeholder="https://..." disabled>
                                </div>
                            </div>
                        </div>

                        <!-- Aba 2: Faturamento -->
                        <div id="faturamento" class="tab-content w-full">
                            <div class="form-grid">
                                <div class="form-group col-4">
                                    <label for="tabelaHonorarios">Tabela de Honorários</label>
                                    <select id="tabelaHonorarios" disabled>
                                        <option value="TUSS">TUSS</option>
                                        <option value="CBHPM">CBHPM</option>
                                        <option value="PROPRIA">Tabela Própria</option>
                                    </select>
                                </div>
                                <div class="form-group col-4">
                                    <label for="prazoPagamento">Prazo Pagamento (Dias)</label>
                                    <input type="number" id="prazoPagamento" value="30" disabled>
                                </div>
                                <div class="form-group col-4">
                                    <label for="taxaAdm">% Taxa Administração</label>
                                    <input type="text" id="taxaAdm" placeholder="0,00%" disabled>
                                </div>
                                <div class="form-group col-12">
                                    <label for="obsFaturamento">Observações de Faturamento</label>
                                    <textarea id="obsFaturamento" rows="3" disabled
                                        placeholder="Ex: Exige autorização prévia para exames de imagem..."></textarea>
                                </div>
                            </div>
                        </div>

                        <!-- Aba 3: Contatos -->
                        <div id="contato-convenio" class="tab-content w-full">
                            <div class="form-grid">
                                <div class="form-group col-6">
                                    <label for="emailFat">E-mail Faturamento</label>
                                    <input type="email" id="emailFat" disabled
                                        placeholder="faturamento@convenio.com.br">
                                </div>
                                <div class="form-group col-6">
                                    <label for="telSuporte">Telefone Suporte Prestador</label>
                                    <input type="text" id="telSuporte" disabled placeholder="(00) 0000-0000">
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </section>

            <!-- Área de Grade (Grid) -->
            <section class="grid-area w-full">
                <div class="grid-header">
                    <span><i class="fas fa-list"></i> Convênios Cadastrados</span>
                    <div class="grid-search">
                        <input type="text" id="inputBusca" placeholder="Filtrar por nome ou CNPJ...">
                        <button type="button" class="btn-search-icon" aria-label="Buscar" title="Buscar">
                            <i class="fas fa-search"></i>
                        </button>
                    </div>
                </div>
                <div class="table-wrapper">
                    <table id="tabelaConvenios">
                        <thead>
                            <tr>
                                <th style="width: 80px;">ID</th>
                                <th>Nome Fantasia</th>
                                <th style="width: 200px;">CNPJ</th>
                                <th style="width: 150px;">ANS</th>
                                <th style="width: 150px;">Tabela</th>
                                <th style="width: 100px;">Status</th>
                            </tr>
                        </thead>
                        <tbody id="corpoTabelaConvenios">
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <!-- JavaScript Externo -->
    <script src="./convenios.js"></script>
</body>

</html>
